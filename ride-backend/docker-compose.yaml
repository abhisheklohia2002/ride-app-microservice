services:
  postgres:
    image: postgres:16-alpine
    container_name: ride-ap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "ride-app"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5808:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: