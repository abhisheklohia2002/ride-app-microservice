services:
   redis:
    image: redis:7-alpine
    container_name: ride-service-redis
    restart: unless-stopped
    ports:
      - "6370:6379"      # Redis default port
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes   # Enables persistence (AOF)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data: