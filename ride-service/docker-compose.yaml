services:
  rideservice-db:
    image: postgres:16-alpine
    container_name: ride-service-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "ride_service"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5809:5432"
    volumes:
      - rideservice_pgdata:/var/lib/postgresql/data

volumes:
  rideservice_pgdata: